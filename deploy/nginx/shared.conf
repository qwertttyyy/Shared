# Install this file inside the existing nginx http context.
map $http_upgrade $shared_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name shared.qwertttyyy.ru;

    root /var/www/shared;
    index index.html;
    include mime.types;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript;

    location ~ ^/api(?:/|$) {
        client_max_body_size 27m;
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $shared_connection_upgrade;
        proxy_read_timeout 120s;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
