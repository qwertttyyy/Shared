services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shared}
      POSTGRES_USER: ${POSTGRES_USER:-shared}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 15
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-shared}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-shared}?sslmode=disable
      PORT: "8080"
      UPLOAD_DIR: /uploads
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set the HTTPS origin in .env.prod}
      COOKIE_SECURE: "true"
      TRUST_PROXY: "true"
      MAX_FILE_MIB: ${MAX_FILE_MIB:-25}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-18080}:8080"
    volumes:
      - uploads:/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
  uploads:
